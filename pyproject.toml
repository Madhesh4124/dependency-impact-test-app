[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dependency-impact-test-app"
version = "0.1.0"
description = "Small Python app for testing dependency impact analysis"
requires-python = ">=3.10"
dependencies = [
    "requests==2.29.0",
    "pydantic==1.10.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0,<9.0",
]

[project.scripts]
dependency-impact-app = "app.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
